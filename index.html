<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Tình Yêu - Valentine 14/2</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="floating-hearts"></div>
    
    <div class="container">
        <header class="header">
            <h1>❤️ Album Tình Yêu của Chúng Mình ❤️</h1>
            <p class="subtitle">Những khoảnh khắc ngọt ngào bên em</p>
            <div class="countdown">
                <span id="days">0</span> ngày <span id="hours">0</span> giờ <span id="minutes">0</span> phút
                <span id="seconds">0</span> giây đến Valentine
            </div>
        </header>

        <div class="gallery" id="gallery">
            <!-- Ảnh sẽ được load từ JS -->
            <div class="loading">Đang tải những kỷ niệm ngọt ngào...</div>
        </div>
    </div>

    <!-- Modal hiển thị chi tiết ảnh -->
    <div id="photoModal" class="modal">
        <span class="close">&times;</span>
        <div class="modal-content">
            <img class="modal-image" id="modalImage" src="">
            <div class="modal-info">
                <h2 id="modalDescription"></h2>
                <p><span>📅</span> Ngày: <span id="modalDate"></span></p>
                <p><span>📍</span> Địa điểm: <span id="modalLocation"></span></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
