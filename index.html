<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bộ Bài Học đánh vần</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000; /* Nền đen */
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #ff69b4; /* Màu hồng cho tiêu đề */
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(255, 105, 180, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 105, 180, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        .shuffle-btn {
            background: #ff69b4; /* Màu hồng */
            color: black;
            border: 1px solid #ff1493;
        }

        .layout-btn {
            background: #ff1493; /* Màu hồng đậm hơn */
            color: black;
            border: 1px solid #ff69b4;
        }

        .loading-btn {
            background: #333333;
            color: #ff69b4;
            cursor: not-allowed;
        }

        .cards-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            perspective: 1000px;
        }

        .card {
            width: 200px;
            height: 280px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(255, 105, 180, 0.3);
            transform-style: preserve-3d;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(255, 105, 180, 0.5);
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .card-front {
            background: linear-gradient(135deg, #ffb6c1 0%, #ff69b4 100%); /* Gradient hồng nhạt đến hồng */
            color: black;
            transform: rotateY(180deg);
            font-size: 1.2em;
            font-weight: bold;
            word-wrap: break-word;
            overflow-y: auto;
            border: 2px solid #ff1493;
        }

        .card-back {
            background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%); /* Gradient hồng đậm */
            background-image: repeating-linear-gradient(45deg, 
                rgba(255, 255, 255, 0.2) 0px, 
                rgba(255, 255, 255, 0.2) 10px, 
                transparent 10px, 
                transparent 20px);
            color: white;
            font-size: 2em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            border: 2px solid #ffb6c1;
        }

        .card-back::before {
            content: "♠ ♥ ♦ ♣";
            position: absolute;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.5);
            transform: rotate(-45deg);
        }

        .error-message {
            background-color: #ff1493;
            color: black;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
            display: none;
            border: 1px solid #ff69b4;
        }

        .loading {
            text-align: center;
            color: #ff69b4;
            font-size: 1.2em;
            margin: 50px 0;
            text-shadow: 0 0 5px rgba(255, 105, 180, 0.5);
        }

        .stats {
            text-align: center;
            color: #ff69b4;
            margin-bottom: 20px;
            font-size: 1.1em;
            opacity: 0.9;
            text-shadow: 0 0 5px rgba(255, 105, 180, 0.5);
        }

        @media (max-width: 768px) {
            .card {
                width: 150px;
                height: 210px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            button {
                padding: 10px 20px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎴 Bộ Bài Học Tiếng Anh</h1>
        
        <div class="stats" id="stats"></div>
        
        <div class="controls">
            <button class="shuffle-btn" id="shuffleBtn" onclick="shuffleCards()">🔄 Xáo bài</button>
            <button class="layout-btn" id="layoutBtn" onclick="toggleLayout()">📑 Dàn bài</button>
        </div>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="loading" class="loading">Đang tải dữ liệu...</div>
        <div id="cardsContainer" class="cards-container"></div>
    </div>

    <script>
        // Cấu hình API
        const API_URL = 'https://script.google.com/macros/s/AKfycby4qMzF6bRiLwmi8qDfYSu4bTxnxRiPqMc88Nc_qfRnIEi-hXeQRfZY3oc9lAeUHn2B/exec'; // Thay thế bằng URL từ Google Apps Script
        
        let originalCards = [];
        let currentCards = [];
        let isGridView = true;
        
        document.addEventListener('DOMContentLoaded', function() {
            fetchData();
        });
        
        async function fetchData() {
            try {
                showLoading(true);
                hideError();
                
                console.log('Đang gọi API:', API_URL);
                
                const response = await fetch(API_URL);
                console.log('Response:', response);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                console.log('Dữ liệu nhận được:', result);
                
                if (result.error) {
                    throw new Error(result.error);
                }
                
                if (!result.success || !result.data || result.data.length === 0) {
                    throw new Error('Không có dữ liệu từ sheet');
                }
                
                originalCards = result.data;
                currentCards = [...originalCards];
                
                document.getElementById('stats').textContent = `Tổng số: ${originalCards.length} lá bài`;
                
                renderCards();
                
            } catch (error) {
                console.error('Lỗi:', error);
                showError('Lỗi tải dữ liệu: ' + error.message + '<br>Vui lòng kiểm tra API URL và thử lại.');
            } finally {
                showLoading(false);
            }
        }
        
        window.shuffleCards = function() {
            const shuffled = [...currentCards];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            currentCards = shuffled;
            
            const btn = document.getElementById('shuffleBtn');
            btn.style.transform = 'rotate(360deg)';
            setTimeout(() => btn.style.transform = '', 300);
            
            renderCards();
        };
        
        window.toggleLayout = function() {
            isGridView = !isGridView;
            const btn = document.getElementById('layoutBtn');
            
            if (isGridView) {
                btn.innerHTML = '📑 Dàn bài';
                document.querySelector('.cards-container').style.flexDirection = 'row';
            } else {
                btn.innerHTML = '🔲 Thu gọn';
                document.querySelector('.cards-container').style.flexDirection = 'column';
                document.querySelector('.cards-container').style.alignItems = 'center';
            }
            
            btn.style.transform = 'scale(0.95)';
            setTimeout(() => btn.style.transform = '', 200);
            
            renderCards();
        };
        
        window.toggleCard = function(cardId) {
            const card = document.getElementById(`card-${cardId}`);
            if (card) {
                card.classList.toggle('flipped');
            }
        };
        
        function renderCards() {
            const container = document.getElementById('cardsContainer');
            
            if (currentCards.length === 0) {
                container.innerHTML = '<div style="color:#ff69b4; text-align:center; width:100%;">Không có lá bài nào</div>';
                return;
            }
            
            let html = '';
            currentCards.forEach(card => {
                html += `
                    <div class="card" id="card-${card.id}" onclick="toggleCard(${card.id})">
                        <div class="card-inner">
                            <div class="card-front">
                                ${card.name}
                            </div>
                            <div class="card-back">
                                ?
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            
            container.style.flexDirection = isGridView ? 'row' : 'column';
            if (!isGridView) {
                container.style.alignItems = 'center';
            }
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.innerHTML = message;
            errorDiv.style.display = 'block';
        }
        
        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }
    </script>
</body>
</html>
